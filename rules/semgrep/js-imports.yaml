# JS/TS import 수집기 — SCA-01(미선언 의존성)의 좌변을 만든다.
# G13: Semgrep 레지스트리 룰은 쓰지 않는다(라이선스). 100% 자체 YAML이며
# metadata.standard_ref에 근거 조항을 기입한다.
rules:
  - id: ansim-js-import-collect
    languages: [javascript, typescript]
    severity: INFO
    message: "import collector"
    patterns:
      - pattern-either:
          - pattern: import $X from "$MOD"
          - pattern: import "$MOD"
          - pattern: require("$MOD")
    metadata: { standard_ref: "TTAK.KO-11.0259 §9.3", ansim_internal: collector }
